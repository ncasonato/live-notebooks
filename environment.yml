# The env that runs JupyterLab and jupyter-mcp-server. Project envs are not
# installed here: each one is a kernel (see the README).
#   live-notebooks-setup --create [--env PREFIX]
# Keep in step with requirements.txt (used when there is no conda).
channels:
  - conda-forge
dependencies:
  - python=3.12
  - jupyterlab=4.6.4
  - jupyter-collaboration=5.0.4
  - pip
  - pip:
      - jupyter-mcp-server==2.2.4
