<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Live Notebooks for Jupyter">
  <title>Live Notebooks for Jupyter</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Shifted down so the artwork (y 4–112) sits centered; the shadow hangs below -->
  <g filter="url(#shadow)" transform="translate(0 6)">
    <!-- Orbit behind the notebook -->
    <ellipse cx="64" cy="84" rx="60" ry="18" fill="none" stroke="#F37726" stroke-width="6" stroke-opacity="0.45" transform="rotate(-18 64 84)"/>
    <!-- Notebook, drawn at its original size and scaled up to fill the canvas -->
    <g transform="translate(25.3 4) scale(1.21) translate(-32 -18)">
      <rect x="32" y="18" width="64" height="88" rx="9" fill="#F8FAFC"/>
      <!-- Cells: run marker + code lines -->
      <path d="M42 30 l8 5 l-8 5 z" fill="#F37726"/>
      <rect x="55" y="31" width="31" height="8" rx="4" fill="#F37726"/>
      <rect x="42" y="47" width="44" height="7" rx="3.5" fill="#94A3B8"/>
      <rect x="42" y="59" width="30" height="7" rx="3.5" fill="#94A3B8"/>
      <!-- Plot output -->
      <polyline points="43,86 52,78 60,82 70,71 85,75" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Orbit in front of the notebook, with its moon -->
    <path d="M6.9 102.5 A60 18 -18 0 0 121.1 65.5" fill="none" stroke="#F37726" stroke-width="6" stroke-linecap="round"/>
    <circle cx="115.7" cy="60.7" r="8" fill="#F37726"/>
  </g>
</svg>
